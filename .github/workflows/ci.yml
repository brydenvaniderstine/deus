name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read
  actions: read   # check-batch-cap asks gh for the newest run that ran

# Cancel a run still in flight when a newer push to the same branch lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # mannac host-side unit tests (plain Apple clang, no extra toolchain)
  # plus the kernel compile check, in one job - a separate job per the
  # same push is billed as a separate rounded-up minute each, which costs
  # more than the few extra seconds of sharing a runner.
  ci:
    name: mannac tests (plain + ASan) + kernel compile check
    runs-on: macos-15
    env:
      MANNAC_WERROR: -Werror
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the ratchet replays the whole history of tests/ratchet.json

      - run: make test-lexer
        if: ${{ !cancelled() }}
      - run: make test-lexer-asan
        if: ${{ !cancelled() }}
      - run: make test-arena
        if: ${{ !cancelled() }}
      - run: make test-arena-asan
        if: ${{ !cancelled() }}
      - run: make test-ast
        if: ${{ !cancelled() }}
      - run: make test-ast-asan
        if: ${{ !cancelled() }}
      - run: make test-parser-state
        if: ${{ !cancelled() }}
      - run: make test-parser-state-asan
        if: ${{ !cancelled() }}
      - run: make test-parser-fixes
        if: ${{ !cancelled() }}
      - run: make test-parser-fixes-asan
        if: ${{ !cancelled() }}
      - run: make test-parser
        if: ${{ !cancelled() }}
      - run: make test-parser-asan
        if: ${{ !cancelled() }}
      - run: make test-ir
        if: ${{ !cancelled() }}
      - run: make test-ir-asan
        if: ${{ !cancelled() }}
      - run: make test-ir-fix
        if: ${{ !cancelled() }}
      - run: make test-ir-fix-asan
        if: ${{ !cancelled() }}
      - run: make test-ir-error-codes
        if: ${{ !cancelled() }}
      - run: make test-e0261-exhaustive
        if: ${{ !cancelled() }}
      - run: make test-rename-property
        if: ${{ !cancelled() }}
      - run: make test-ir-memory-stress
        if: ${{ !cancelled() }}
      - run: make test-ir-fix-limits
        if: ${{ !cancelled() }}
      - run: make audit-ir-poison
        if: ${{ !cancelled() }}
      - run: make test-poison-paths-script
        if: ${{ !cancelled() }}
      - run: make check-poison-paths
        if: ${{ !cancelled() }}
      - run: make test-nocascade-sinks-script
        if: ${{ !cancelled() }}
      - run: make check-nocascade-holes
        if: ${{ !cancelled() }}
      - run: make test-gen-nocascade-script
        if: ${{ !cancelled() }}
      - run: make test-nocascade-prove-script
        if: ${{ !cancelled() }}
      - run: make check-nocascade-index
        if: ${{ !cancelled() }}
      - run: make check-generated
        if: ${{ !cancelled() }}
      - run: make test-check-generated-script
        if: ${{ !cancelled() }}
      - run: make test-ir-unit
        if: ${{ !cancelled() }}
      - run: make test-ir-unit-asan
        if: ${{ !cancelled() }}
      - run: make test-ir-ndebug
        if: ${{ !cancelled() }}
      - run: make test-determinism
        if: ${{ !cancelled() }}
      - run: make test-ratchet-script
        if: ${{ !cancelled() }}
      - run: make test-register-script
        if: ${{ !cancelled() }}
      - run: make check-register
        if: ${{ !cancelled() }}
      - run: make test-ci-targets-script
        if: ${{ !cancelled() }}
      - run: make check-ci-targets
        if: ${{ !cancelled() }}
      - run: make check-kernel-loc
        if: ${{ !cancelled() }}
      - run: make test-kernel-loc-script
        if: ${{ !cancelled() }}
      - run: make test-measure-height-script
        if: ${{ !cancelled() }}
      - run: make test-boot-check-script
        if: ${{ !cancelled() }}
      - run: make test-batch-cap-script
        if: ${{ !cancelled() }}
      - run: make test-makefile-no-qemu
        if: ${{ !cancelled() }}
      - run: make test-nocascade-wired-script
        if: ${{ !cancelled() }}
      - run: make check-nocascade-wired
        if: ${{ !cancelled() }}

      # One failing check must not hide the others (CI run 40546449691: check-batch-cap failed and seven later steps never ran). Every step from here
      # on runs unless the run was cancelled, whatever failed before it; the job still fails if any of them failed.
      - run: make test-retro-rules-script
        if: ${{ !cancelled() }}
      - run: make check-retro-rules
        if: ${{ !cancelled() }}
      - run: make test-ratchet
        if: ${{ !cancelled() }}
      - run: make test-audit-repros
        if: ${{ !cancelled() }}

      # Kernel compile check only (make all -> build/kernel.elf). Does not
      # boot it - no Limine/QEMU/OVMF needed for that, just clang + ld.lld.
      - name: Cache Homebrew downloads
        if: ${{ !cancelled() }}
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-lld-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            brew-lld-${{ runner.os }}-
      - name: Install ld.lld
        if: ${{ !cancelled() }}
        run: |
          brew install lld
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
      # limine/ is gitignored (vendored, not tracked); make all fetches it
      # at the pinned tag/hash automatically - see tools/fetch-limine.sh.
      - run: make all
        if: ${{ !cancelled() }}

      # The batch cap is LAST so that it hides nothing: it asks gh for the base, so it is the one check that needs the network and the token.
      # The base is the head of the newest ci.yml run on main whose jobs RAN to a conclusion, green or red (a run cancelled by the next push, or one GitHub refused to start,
      # is skipped); no base found fails (Linux review of batch C, finding 2; Bryden 2026-10-27 for the red-run base).
      - run: make check-batch-cap
        if: ${{ !cancelled() }}
        env:
          BATCH_BASE: last-run
          GH_TOKEN: ${{ github.token }}

  # Step 20d/20e (register V2, V3, V1, C6, V7): the same host-side suites on Linux with gcc, ASan + UBSan + LSan, the audit repros, the poison audit with
  # clang + llvm-cov, and a short fuzz run (60 s per target) on every push. Cost decision (register V7, Bryden 2026-10-25): this job runs on every
  # push, the macOS job is unchanged; an Ubuntu minute costs a tenth of a macOS minute, and what each job covers is listed here.
  linux:
    name: Linux gcc (ASan + UBSan + LSan), audit repros, clang audit, short fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MANNAC_CC: gcc
      MANNAC_WERROR: -Werror
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Toolchain (gcc, clang with libFuzzer and llvm-cov)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make python3 clang llvm
          v=$(clang -dumpversion | cut -d. -f1)
          sudo apt-get install -y "libclang-rt-${v}-dev" "llvm-${v}"
          gcc --version | head -1
          clang --version | head -1
          echo "LLVM_CLANG=$(command -v clang)" >> "$GITHUB_ENV"

      - run: make test-lexer
        if: ${{ !cancelled() }}
      - run: make test-lexer-asan
        if: ${{ !cancelled() }}
      - run: make test-arena
        if: ${{ !cancelled() }}
      - run: make test-arena-asan
        if: ${{ !cancelled() }}
      - run: make test-ast
        if: ${{ !cancelled() }}
      - run: make test-ast-asan
        if: ${{ !cancelled() }}
      - run: make test-parser-state
        if: ${{ !cancelled() }}
      - run: make test-parser-state-asan
        if: ${{ !cancelled() }}
      - run: make test-parser-fixes
        if: ${{ !cancelled() }}
      - run: make test-parser-fixes-asan
        if: ${{ !cancelled() }}
      - run: make test-parser
        if: ${{ !cancelled() }}
      - run: make test-parser-asan
        if: ${{ !cancelled() }}
      - run: make test-ir
        if: ${{ !cancelled() }}
      - run: make test-ir-asan
        if: ${{ !cancelled() }}
      - run: make test-ir-fix
        if: ${{ !cancelled() }}
      - run: make test-ir-fix-asan
        if: ${{ !cancelled() }}
      - run: make test-ir-error-codes
        if: ${{ !cancelled() }}
      - run: make test-e0261-exhaustive
        if: ${{ !cancelled() }}
      - run: make test-rename-property
        if: ${{ !cancelled() }}
      - run: make test-ir-memory-stress
        if: ${{ !cancelled() }}
      - run: make test-ir-fix-limits
        if: ${{ !cancelled() }}
      - run: make audit-ir-poison
        if: ${{ !cancelled() }}
      - run: make test-poison-paths-script
        if: ${{ !cancelled() }}
      - run: make check-poison-paths
        if: ${{ !cancelled() }}
      - run: make test-nocascade-sinks-script
        if: ${{ !cancelled() }}
      - run: make check-nocascade-holes
        if: ${{ !cancelled() }}
      - run: make test-gen-nocascade-script
        if: ${{ !cancelled() }}
      - run: make test-nocascade-prove-script
        if: ${{ !cancelled() }}
      - run: make check-nocascade-index
        if: ${{ !cancelled() }}
      - run: make check-generated
        if: ${{ !cancelled() }}
      - run: make test-check-generated-script
        if: ${{ !cancelled() }}
      - run: make test-ir-unit
        if: ${{ !cancelled() }}
      - run: make test-ir-unit-asan
        if: ${{ !cancelled() }}
      - run: make test-ir-ndebug
        if: ${{ !cancelled() }}
      - run: make test-determinism
        if: ${{ !cancelled() }}
      - run: make test-audit-repros
        if: ${{ !cancelled() }}
      - run: make test-fuzz-script
        if: ${{ !cancelled() }}
      - run: make check-kernel-loc
        if: ${{ !cancelled() }}
      - run: make test-kernel-loc-script
        if: ${{ !cancelled() }}
      - run: make test-measure-height-script
        if: ${{ !cancelled() }}
      - run: make test-boot-check-script
        if: ${{ !cancelled() }}
      - run: make test-coverage-check-script
        if: ${{ !cancelled() }}
      # Every uncovered line of lexer.c, parser.c and ir*.c has a reason in tests/coverage_justified.txt (register V6); runs the instrumented suites with clang.
      - run: make coverage-check
        if: ${{ !cancelled() }}
      # The short fuzz run: lexer, parser, typed IR gated and ungated, 60 s each, from the committed corpora. Any crash, timeout, out-of-memory
      # or sanitizer report leaves an artifact and fails the step (tools/fuzz/run_fuzzers.sh exits 1).
      - name: Short fuzz run (60 s per target)
        if: ${{ !cancelled() }}
        run: |
          export DURATION_LEXER=60 DURATION_PARSER=60 DURATION_IR=60
          make fuzz
          make fuzz-ir
          make fuzz-ir-ungated
      - name: Upload fuzz artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: build/fuzz/artifacts
          if-no-files-found: ignore

  # Step 20h (register K4, K5): the kernel boots under QEMU and its serial log is CHECKED (make test-boot), and the three W^X violations fault as promised
  # (make test-wx). The machine is the Milestone 1 one: 8 GiB, never shrunk to make a run pass. Own job so that a runner problem (firmware path, TCG speed,
  # 8 GiB on the runner) is seen as exactly that and does not hide the other jobs.
  # Step 21b: the single-fault injection sweep, its own job (decision D4, Bryden 2026-10-25: never sampled, never folded into a job it would slow).
  nocascade:
    name: No-cascade injection sweep (ASan + UBSan, every point)
    runs-on: ubuntu-latest
    # Measured on the hosted runner: 8 min 07 s (487 s, CI run 40546449691, kept in tests/nocascade/JOB_TIME); `make check-nocascade-wired` (W4) fails if this is under twice that.
    timeout-minutes: 45
    env:
      MANNAC_WERROR: -Werror
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make python3 clang
          clang --version | head -1
      - run: make check-inject-hook-absent
        if: ${{ !cancelled() }}
      - run: make test-nocascade-inject-script
        if: ${{ !cancelled() }}
      - run: make test-nocascade-inject
        if: ${{ !cancelled() }}
      - run: make check-nocascade-prove
        if: ${{ !cancelled() }}
      - run: make check-nocascade-sinks
        if: ${{ !cancelled() }}

  boot:
    name: Kernel boot smoke (QEMU, 8 GiB) + W^X tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MANNAC_WERROR: -Werror
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (clang, lld, QEMU, OVMF)
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 clang lld qemu-system-x86 ovmf
          qemu-system-x86_64 --version | head -1
          tools/find_ovmf.sh code; tools/find_ovmf.sh vars
          free -m | head -2
      # make all fetches limine at the pinned tag/hash (tools/fetch-limine.sh)
      - run: make all
        if: ${{ !cancelled() }}
      - run: make test-boot
        if: ${{ !cancelled() }}
      - run: make test-wx
        if: ${{ !cancelled() }}
      - name: Serial logs
        if: always()
        run: |
          for f in build/boot_smoke/serial.log build/test_wx/boot_*/serial.log; do echo "=== $f"; sed 's/\x1b\[[0-9;?=]*[A-Za-z]//g' "$f" 2>/dev/null | tail -40; done
